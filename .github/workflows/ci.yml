name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jk
          POSTGRES_PASSWORD: jk_ci
          POSTGRES_DB: jk_manpower_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jk -d jk_manpower_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://jk:jk_ci@localhost:5432/jk_manpower_erp_test
          DIRECT_URL: postgresql://jk:jk_ci@localhost:5432/jk_manpower_erp_test

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build
        env:
          DATABASE_URL: postgresql://jk:jk_ci@localhost:5432/jk_manpower_erp_test
          DIRECT_URL: postgresql://jk:jk_ci@localhost:5432/jk_manpower_erp_test
          NEXTAUTH_SECRET: ci-test-secret
          AUTH_SECRET: ci-test-secret

      - name: Unit and integration tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://jk:jk_ci@localhost:5432/jk_manpower_erp_test
          DIRECT_URL: postgresql://jk:jk_ci@localhost:5432/jk_manpower_erp_test
          NEXTAUTH_SECRET: ci-test-secret
          AUTH_SECRET: ci-test-secret

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
